name: Secure CI

on:
  push:
    branches: [ main ]

# 【O 部分核心】工作流程最小權限設定 (Least Privilege)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pin Actions 到穩定的 40 位 Full Commit SHA (最嚴謹防範供應鏈攻擊)
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0 (官方最新穩定 SHA)
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run static analysis
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics